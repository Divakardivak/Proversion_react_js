
<!DOCTYPE html>
<html>
<body>
<canvas id="c"></canvas>
<script>
window.onload = async () => {
  const img = new Image();
  img.src = '/assets/proversion-logo-ref.jpg';
  await img.decode();

  const w = img.naturalWidth;
  const h = img.naturalHeight;
  const canvas = document.getElementById('c');
  canvas.width = w;
  canvas.height = h;
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  ctx.drawImage(img, 0, 0);

  const imgData = ctx.getImageData(0, 0, w, h);
  const data = imgData.data;

  // Let's find white & yellow bounding boxes
  let minX = w, maxX = 0, minY = h, maxY = 0;
  let yellowMinX = w, yellowMaxX = 0, yellowMinY = h, yellowMaxY = 0;

  // We will also generate transparent PNG
  const outCanvas = document.createElement('canvas');
  outCanvas.width = w;
  outCanvas.height = h;
  const outCtx = outCanvas.getContext('2d');
  const outData = outCtx.createImageData(w, h);
  const out = outData.data;

  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const idx = (y * w + x) * 4;
      const r = data[idx];
      const g = data[idx + 1];
      const b = data[idx + 2];

      // White detection: high brightness and low saturation
      const maxC = Math.max(r, g, b);
      const minC = Math.min(r, g, b);
      const sat = maxC === 0 ? 0 : (maxC - minC) / maxC;
      const lum = (r * 0.299 + g * 0.587 + b * 0.114);

      // Yellow detection: high red, moderate/high green, low blue
      const isYellow = (r > 190 && g > 130 && b < 100 && (r - b) > 100);

      // Is white or near-white edge
      const isWhite = (lum > 210 && sat < 0.25);
      const isWhiteEdge = (lum > 150 && lum <= 210 && sat < 0.35);

      if (isYellow) {
        if (x < yellowMinX) yellowMinX = x;
        if (x > yellowMaxX) yellowMaxX = x;
        if (y < yellowMinY) yellowMinY = y;
        if (y > yellowMaxY) yellowMaxY = y;

        if (x < minX) minX = x;
        if (x > maxX) maxX = x;
        if (y < minY) minY = y;
        if (y > maxY) maxY = y;

        out[idx] = r;
        out[idx + 1] = g;
        out[idx + 2] = b;
        out[idx + 3] = 255;
      } else if (isWhite) {
        if (x < minX) minX = x;
        if (x > maxX) maxX = x;
        if (y < minY) minY = y;
        if (y > maxY) maxY = y;

        out[idx] = 255;
        out[idx + 1] = 255;
        out[idx + 2] = 255;
        out[idx + 3] = 255;
      } else if (isWhiteEdge) {
        // Antialiasing edge
        const alpha = Math.min(255, Math.max(0, (lum - 140) * 3.6));
        if (alpha > 40) {
          if (x < minX) minX = x;
          if (x > maxX) maxX = x;
          if (y < minY) minY = y;
          if (y > maxY) maxY = y;

          out[idx] = 255;
          out[idx + 1] = 255;
          out[idx + 2] = 255;
          out[idx + 3] = alpha;
        }
      } else {
        out[idx + 3] = 0;
      }
    }
  }

  // Now create tightly cropped transparent canvas
  const padding = 20;
  const cropW = (maxX - minX) + padding * 2;
  const cropH = (maxY - minY) + padding * 2;
  const cropCanvas = document.createElement('canvas');
  cropCanvas.width = cropW;
  cropCanvas.height = cropH;
  const cropCtx = cropCanvas.getContext('2d');

  outCtx.putImageData(outData, 0, 0);
  cropCtx.drawImage(outCanvas, minX - padding, minY - padding, cropW, cropH, 0, 0, cropW, cropH);

  window.__LOGO_INFO__ = {
    imageWidth: w,
    imageHeight: h,
    bbox: { minX, maxX, minY, maxY, width: maxX - minX, height: maxY - minY },
    yellowBbox: { yellowMinX, yellowMaxX, yellowMinY, yellowMaxY },
    dataUrl: cropCanvas.toDataURL('image/png')
  };
  console.log('=== LOGO_INFO_READY ===', JSON.stringify({
    bbox: window.__LOGO_INFO__.bbox,
    yellowBbox: window.__LOGO_INFO__.yellowBbox
  }));
};
</script>
</body>
</html>
